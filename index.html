<style>

  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

  body::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.6),transparent 60%);pointer-events:none}
  canvas{position:relative;display:block;margin:0 auto;height:100%;aspect-ratio:9/16;max-width:100%;background:#E9E4E8;box-shadow:0 0 0 1px rgba(214,180,120,.7),0 0 60px rgba(60,45,25,.25)}
  /* 手機打橫（畫面太矮，直幅會細到睇唔到）：叫玩家打直 */
  #rotate{display:none;position:fixed;inset:0;z-index:99;background:#E9E4E8;color:#5E4E40;align-items:center;justify-content:center;gap:18px;font:700 18px 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.1em}
  #rotate svg{width:44px;height:44px;color:#B98D52;animation:rot 1.6s ease-in-out infinite}
  @keyframes rot{0%,20%{transform:rotate(90deg)}60%,100%{transform:rotate(0)}}
  @media (orientation:landscape) and (max-height:480px){#rotate{display:flex}}

<canvas id="c"></canvas>
<div id="rotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2" fill="currentColor" fill-opacity=".18"/><path d="M11 18.5h2"/></svg>請把手機轉為直向</div>

  <div style="margin-top:5vh;font-size:14px;letter-spacing:.3em;color:#8E6A39;font-weight:700">載入中…</div>
</div>
<!-- 3D 戰鬥畫面用：Three.js 係本機檔案，唔靠外網 -->
